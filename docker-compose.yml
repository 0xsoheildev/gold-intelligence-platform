version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: gold_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gold_user
      POSTGRES_PASSWORD: gold_pass
      POSTGRES_DB: gold_intelligence
    ports:
      - "5432:5432"
    volumes:
      - gold_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold_user -d gold_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: gold_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://gold_user:gold_pass@db:5432/gold_intelligence
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ingestion:/ingestion
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  gold_db_data:
